<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie / Series Details - MovieFlix</title>
    <link rel="stylesheet" href="movies.css">
</head>
<body>

<button class="back-btn" onclick="window.location.href='./index.html'">⬅ Back</button>

<div id="movie-details">
    <p class="loading">Loading movie details...</p>
</div>

<!-- PLAYER -->
<div class="player-section">
    <div class="player-wrapper" onclick="playMovie()">
        <div class="play-overlay">▶</div>

        <iframe
            id="player-frame"
            allowfullscreen
            frameborder="0">
        </iframe>
    </div>

    <!-- SERIES CONTROLS -->
    <div class="series-controls" id="series-controls" style="display:none;">
        <select id="seasonSelect" onchange="loadEpisodes()">
            <option value="">Select Season</option>
        </select>

        <select id="episodeSelect" onchange="playEpisode()">
            <option value="">Select Episode</option>
        </select>
    </div>
</div>

<!-- CONTROLS -->
<div class="player-controls">
    <div class="audio-controls" id="audio-controls" style="display:none;">
        <button onclick="changeAudio(1)">English</button>
        <button onclick="changeAudio(2)">Hindi</button>
        <button onclick="changeAudio(3)">Dual Audio</button>
    </div>
</div>

<h2>Suggested</h2>
<div id="suggestions" class="movie-grid"></div>

<script src="movie.js"></script>

</body>
</html>
